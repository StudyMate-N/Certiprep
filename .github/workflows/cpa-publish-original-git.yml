name: Publish CPA original study PDF (Git binary)
on:
  workflow_dispatch:
  push:
    paths:
      - 'research-library/kenya-cpa/original/CA11-accounting-foundations.md'
      - 'research-library/kenya-cpa/scripts/build_original_pdf.py'
      - '.github/workflows/cpa-publish-original-git.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab==4.2.5
      - name: Build original PDF
        run: python research-library/kenya-cpa/scripts/build_original_pdf.py
      - name: Validate source PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research-library/kenya-cpa/assets/pdfs/CA11-accounting-foundations-original.pdf')
          b=p.read_bytes()
          assert b[:5] == b'%PDF-', 'Not a PDF binary'
          assert len(b)>1000
          print('Verified original PDF binary size:',len(b))
          PY
      - name: Stage non-LFS original in a separate path
        run: |
          mkdir -p research-library/kenya-cpa/assets/original
          cp research-library/kenya-cpa/assets/pdfs/CA11-accounting-foundations-original.pdf research-library/kenya-cpa/assets/original/CA11-accounting-foundations.pdf
      - name: Commit original binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-library/kenya-cpa/assets/original/CA11-accounting-foundations.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified original CA11 PDF binary'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kenya-cpa-original-pdf
          path: research-library/kenya-cpa/assets/original/*.pdf
